<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng & Trực quan hóa Hệ Mã A5/1 & Tiny A5/1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0b0f19',
                            card: '#111827',
                            border: '#1f2937',
                            accent: '#3b82f6',
                            clock: '#f59e0b',
                            tap: '#a855f7',
                            out: '#10b981'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .font-mono {
            font-family: 'Fira Code', monospace;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        /* Animation chèn bit t mới vào vị trí 0 từ trên xuống */
        @keyframes dropNewBit {
            0% {
                transform: translateY(-24px) scale(1.25);
                opacity: 0;
                filter: brightness(2);
            }
            60% {
                transform: translateY(3px) scale(1.1);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Animation dịch chuyển các bit cũ sang phải */
        @keyframes shiftExistingRight {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* Animation đẩy bit cuối cùng ra khỏi thanh ghi và mờ dần */
        @keyframes exitDroppedBit {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateX(12px) scale(0.9);
                opacity: 0.7;
            }
            100% {
                transform: translateX(28px) scale(0.5);
                opacity: 0;
            }
        }

        .animate-drop-bit {
            animation: dropNewBit 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-shift-right {
            animation: shiftExistingRight 0.45s ease-out forwards;
        }

        .animate-exit-bit {
            animation: exitDroppedBit 0.55s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-cyber-bg text-gray-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const maj = (a, b, c) => (a + b + c >= 2 ? 1 : 0);
        const validateBinary = (str) => /^[01]*$/.test(str);

        // Quy tắc 3-bit chuẩn Bài Giảng (Tiny A5/1): A=000, B=001, ..., H=111
        const THREE_BIT_MAP = {
            'A': '000', 'B': '001', 'C': '010', 'D': '011',
            'E': '100', 'F': '101', 'G': '110', 'H': '111'
        };
        const THREE_BIT_REVERSE = {
            '000': 'A', '001': 'B', '010': 'C', '011': 'D',
            '100': 'E', '101': 'F', '110': 'G', '111': 'H'
        };

        const textToBinary3Bit = (text) => {
            return text.toUpperCase().replace(/[^A-H]/g, '').split('')
                .map(ch => THREE_BIT_MAP[ch])
                .join('');
        };

        const binaryToText3Bit = (bin) => {
            if (!bin) return '';
            let text = '';
            for (let i = 0; i < bin.length; i += 3) {
                const chunk = bin.slice(i, i + 3);
                if (chunk.length === 3 && THREE_BIT_REVERSE[chunk]) {
                    text += THREE_BIT_REVERSE[chunk];
                }
            }
            return text;
        };

        // Standard 8-bit ASCII for Full A5/1
        const textToBinary8Bit = (text) => {
            return text.split('')
                .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
                .join('');
        };

        const binaryToText8Bit = (bin) => {
            if (!bin || bin.length % 8 !== 0) return '';
            let text = '';
            for (let i = 0; i < bin.length; i += 8) {
                const byte = bin.slice(i, i + 8);
                text += String.fromCharCode(parseInt(byte, 2));
            }
            return text;
        };

        const ALGO_CONFIGS = {
            tiny: {
                name: "Tiny A5/1",
                keyLength: 23,
                defaultKey: "10010101001110100110000",
                defaultInput: "111", // H = 111
                X: { len: 6, clockIdx: 1, taps: [2, 4, 5], outIdx: 5 },
                Y: { len: 8, clockIdx: 3, taps: [6, 7], outIdx: 7 },
                Z: { len: 9, clockIdx: 3, taps: [2, 7, 8], outIdx: 8 },
                calcT: {
                    X: (X) => X[2] ^ X[4] ^ X[5],
                    Y: (Y) => Y[6] ^ Y[7],
                    Z: (Z) => Z[2] ^ Z[7] ^ Z[8]
                },
                keystreamBit: (X, Y, Z) => X[5] ^ Y[7] ^ Z[8],
                getKeystreamFormula: (X, Y, Z) => ({
                    formula: `s = X[5] ⊕ Y[7] ⊕ Z[8]`,
                    calculation: `${X[5]} ⊕ ${Y[7]} ⊕ ${Z[8]} = ${X[5] ^ Y[7] ^ Z[8]}`
                })
            },
            full: {
                name: "A5/1 Đầy đủ (Standard 64-bit)",
                keyLength: 64,
                defaultKey: "1101001010110010101010111111111111111111111111111111111111111111",
                defaultInput: "000101001",
                X: { len: 19, clockIdx: 8, taps: [13, 16, 17, 18], outIdx: 18 },
                Y: { len: 22, clockIdx: 10, taps: [20, 21], outIdx: 21 },
                Z: { len: 23, clockIdx: 10, taps: [7, 20, 21, 22], outIdx: 22 },
                calcT: {
                    X: (X) => X[13] ^ X[16] ^ X[17] ^ X[18],
                    Y: (Y) => Y[20] ^ Y[21],
                    Z: (Z) => Z[7] ^ Z[20] ^ Z[21] ^ Z[22]
                },
                keystreamBit: (X, Y, Z) => X[18] ^ Y[21] ^ Z[22],
                getKeystreamFormula: (X, Y, Z) => ({
                    formula: `s = X[18] ⊕ Y[21] ⊕ Z[22]`,
                    calculation: `${X[18]} ⊕ ${Y[21]} ⊕ ${Z[22]} = ${X[18] ^ Y[21] ^ Z[22]}`
                })
            }
        };

        const computeSimulationSteps = (algoKey, keyStr, inputStr, isEncrypt) => {
            const cfg = ALGO_CONFIGS[algoKey] || ALGO_CONFIGS.tiny;
            const isValidKey = keyStr && keyStr.length === cfg.keyLength && validateBinary(keyStr);
            const isValidInput = inputStr && inputStr.length > 0 && validateBinary(inputStr);

            const xLen = cfg.X.len;
            const yLen = cfg.Y.len;
            const zLen = cfg.Z.len;

            let X = isValidKey ? keyStr.slice(0, xLen).split('').map(Number) : new Array(xLen).fill(0);
            let Y = isValidKey ? keyStr.slice(xLen, xLen + yLen).split('').map(Number) : new Array(yLen).fill(0);
            let Z = isValidKey ? keyStr.slice(xLen + yLen, xLen + yLen + zLen).split('').map(Number) : new Array(zLen).fill(0);

            const steps = [];

            const initKeystreamDetail = cfg.getKeystreamFormula(X, Y, Z);
            const initKeystreamBit = cfg.keystreamBit(X, Y, Z);

            // Bước 0: Trạng thái ban đầu
            steps.push({
                stepIndex: 0,
                inputBit: null,
                X: [...X],
                Y: [...Y],
                Z: [...Z],
                clockBits: { X: X[cfg.X.clockIdx] ?? 0, Y: Y[cfg.Y.clockIdx] ?? 0, Z: Z[cfg.Z.clockIdx] ?? 0 },
                m: null,
                willClock: { X: false, Y: false, Z: false },
                tValues: { X: null, Y: null, Z: null },
                keystreamBit: initKeystreamBit,
                keystreamDetail: initKeystreamDetail,
                outputBit: null,
                resultSoFar: '',
                description: `Trạng thái ban đầu phân bổ từ Khóa K (${cfg.keyLength}-bit).`
            });

            if (!isValidKey || !isValidInput) {
                return { steps, finalResult: '', error: `Vui lòng nhập đúng Khóa K (${cfg.keyLength}-bit) và Chuỗi bit đầu vào.` };
            }

            let resultBits = [];
            let keystreamBits = [];

            for (let i = 0; i < inputStr.length; i++) {
                const inputBit = parseInt(inputStr[i], 10);

                const clockX = X[cfg.X.clockIdx];
                const clockY = Y[cfg.Y.clockIdx];
                const clockZ = Z[cfg.Z.clockIdx];

                const m = maj(clockX, clockY, clockZ);

                const willClockX = clockX === m;
                const willClockY = clockY === m;
                const willClockZ = clockZ === m;

                const tX = cfg.calcT.X(X);
                const tY = cfg.calcT.Y(Y);
                const tZ = cfg.calcT.Z(Z);

                const stateBefore = { X: [...X], Y: [...Y], Z: [...Z] };

                let stateAfterX = [...X];
                if (willClockX) {
                    for (let j = xLen - 1; j > 0; j--) stateAfterX[j] = stateAfterX[j - 1];
                    stateAfterX[0] = tX;
                    X = [...stateAfterX];
                }

                let stateAfterY = [...Y];
                if (willClockY) {
                    for (let j = yLen - 1; j > 0; j--) stateAfterY[j] = stateAfterY[j - 1];
                    stateAfterY[0] = tY;
                    Y = [...stateAfterY];
                }

                let stateAfterZ = [...Z];
                if (willClockZ) {
                    for (let j = zLen - 1; j > 0; j--) stateAfterZ[j] = stateAfterZ[j - 1];
                    stateAfterZ[0] = tZ;
                    Z = [...stateAfterZ];
                }

                const keystreamBit = cfg.keystreamBit(X, Y, Z);
                const keystreamDetail = cfg.getKeystreamFormula(X, Y, Z);
                const outputBit = inputBit ^ keystreamBit;

                keystreamBits.push(keystreamBit);
                resultBits.push(outputBit);

                steps.push({
                    stepIndex: i + 1,
                    bitIndex: i,
                    inputBit: inputBit,
                    stateBefore: stateBefore,
                    stateAfterX: stateAfterX,
                    stateAfterY: stateAfterY,
                    stateAfterZ: stateAfterZ,
                    clockBits: { X: clockX, Y: clockY, Z: clockZ },
                    m: m,
                    willClock: { X: willClockX, Y: willClockY, Z: willClockZ },
                    tValues: { X: tX, Y: tY, Z: tZ },
                    X: [...X],
                    Y: [...Y],
                    Z: [...Z],
                    keystreamBit: keystreamBit,
                    keystreamDetail: keystreamDetail,
                    keystreamSoFar: keystreamBits.join(''),
                    outputBit: outputBit,
                    resultSoFar: resultBits.join('')
                });
            }

            return {
                steps,
                finalKeystream: keystreamBits.join(''),
                finalResult: resultBits.join(''),
                error: null
            };
        };

        const AnimatedRegister = ({ name, bits, prevBits, clockIdx, tapIndices, outIdx, willClock, tVal, isClockingNow }) => {
            const lastBitDropped = prevBits ? prevBits[prevBits.length - 1] : null;

            return (
                <div className={`p-3 sm:p-4 rounded-xl border transition-all duration-300 ${isClockingNow ? 'border-amber-500 bg-amber-950/20 ring-1 ring-amber-500/30' : 'border-gray-800 bg-gray-950'}`}>
                    {/* Header */}
                    <div className="flex items-center justify-between gap-2 mb-2">
                        <div className="flex items-center gap-2">
                            <span className="font-bold text-base text-sky-400">Thanh ghi {name}</span>
                            <span className="text-xs text-gray-400 font-mono">({bits.length} bits)</span>
                            {willClock ? (
                                <span className="text-[11px] px-2 py-0.5 rounded font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                                    Quay (Clock)
                                </span>
                            ) : (
                                <span className="text-[11px] px-2 py-0.5 rounded text-gray-500 bg-gray-900 border border-gray-800">
                                    Dừng
                                </span>
                            )}
                        </div>

                        <div className="text-xs font-mono text-gray-400 flex gap-3">
                            <span>Clock: <strong className="text-amber-400">{name}[{clockIdx}]</strong></span>
                            <span>Taps: <strong className="text-purple-400">[{tapIndices.join(', ')}]</strong></span>
                            <span>Out: <strong className="text-emerald-400">[{outIdx}]</strong></span>
                        </div>
                    </div>

                    {/* Công thức phản hồi */}
                    <div className="text-xs font-mono text-gray-300 mb-2.5 bg-slate-900/80 px-2.5 py-1.5 rounded border border-slate-800 flex justify-between items-center">
                        <span>Đa thức phản hồi: t<sub>{name}</sub> = {tapIndices.map(idx => `${name}[${idx}]`).join(' ⊕ ')}</span>
                        <span className="text-purple-300 font-bold">{tVal !== null ? `t = ${tVal}` : ''}</span>
                    </div>

                    {/* Bit Cells with animated shifting */}
                    <div className="flex items-center justify-start gap-1 py-1 overflow-x-auto relative">
                        {bits.map((bit, idx) => {
                            const isClock = idx === clockIdx;
                            const isTap = tapIndices.includes(idx);
                            const isOut = idx === outIdx;
                            const isJustInserted = idx === 0 && isClockingNow;
                            const isShiftedBit = idx > 0 && isClockingNow;

                            let colorStyle = "border-slate-800 bg-slate-900 text-slate-200";
                            let animClass = "";

                            if (isJustInserted) {
                                colorStyle = "border-amber-400 bg-amber-500/30 text-amber-200 font-bold ring-2 ring-amber-400 shadow-lg shadow-amber-500/30";
                                animClass = "animate-drop-bit";
                            } else if (isShiftedBit) {
                                animClass = "animate-shift-right";
                                if (isClock) colorStyle = "border-amber-500 bg-amber-950/60 text-amber-300 font-bold";
                                else if (isOut) colorStyle = "border-emerald-500 bg-emerald-950/60 text-emerald-300 font-bold";
                                else if (isTap) colorStyle = "border-purple-500 bg-purple-950/60 text-purple-300 font-bold";
                            } else {
                                if (isClock) colorStyle = "border-amber-500 bg-amber-950/60 text-amber-300 font-bold";
                                else if (isOut) colorStyle = "border-emerald-500 bg-emerald-950/60 text-emerald-300 font-bold";
                                else if (isTap) colorStyle = "border-purple-500 bg-purple-950/60 text-purple-300 font-bold";
                            }

                            return (
                                <div key={idx} className={`flex flex-col items-center flex-shrink-0 relative ${animClass}`}>
                                    {/* Mũi tên chèn bit mới tại vị trí 0 */}
                                    {isJustInserted && (
                                        <div className="absolute -top-5 text-[10px] text-amber-400 font-bold font-mono animate-bounce flex flex-col items-center">
                                            <span>↓ t={tVal}</span>
                                        </div>
                                    )}

                                    <span className="text-[10px] text-gray-500 font-mono">{idx}</span>
                                    <div className={`w-7 h-9 sm:w-8 sm:h-10 rounded border flex items-center justify-center font-mono text-sm sm:text-base transition-all ${colorStyle}`}>
                                        {bit}
                                    </div>
                                    <div className="h-3 mt-0.5 text-[9px] font-mono font-bold">
                                        {isClock && <span className="text-amber-400">x<sub>{clockIdx}</sub></span>}
                                        {isTap && !isClock && <span className="text-purple-400">T</span>}
                                        {isOut && <span className="text-emerald-400">O</span>}
                                    </div>
                                </div>
                            );
                        })}

                        {/* Ô bit bị đẩy ra ngoài (Loại bỏ) khi quay */}
                        {isClockingNow && lastBitDropped !== null && (
                            <div className="flex flex-col items-center flex-shrink-0 opacity-80 animate-exit-bit ml-2 border-l border-dashed border-red-500/50 pl-2">
                                <span className="text-[10px] text-red-400 font-mono">Xóa</span>
                                <div className="w-7 h-9 sm:w-8 sm:h-10 rounded border border-red-500 bg-red-950/40 text-red-300 font-mono text-sm flex items-center justify-center font-bold">
                                    {lastBitDropped}
                                </div>
                                <span className="text-[9px] text-red-400 font-mono mt-0.5">➔ OUT</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CombinedSlideView = ({ step, initialKey, isEncrypt, inputData, algoKey, activeSubStep, setActiveSubStep }) => {
            const cfg = ALGO_CONFIGS[algoKey] || ALGO_CONFIGS.tiny;

            // BƯỚC 0: Khởi tạo
            if (!step || step.stepIndex === 0) {
                const xLen = cfg.X.len;
                const yLen = cfg.Y.len;
                const zLen = cfg.Z.len;

                const initX = initialKey ? initialKey.slice(0, xLen) : "0".repeat(xLen);
                const initY = initialKey ? initialKey.slice(xLen, xLen + yLen) : "0".repeat(yLen);
                const initZ = initialKey ? initialKey.slice(xLen + yLen, xLen + yLen + zLen) : "0".repeat(zLen);

                const xArr = initX.split('').map(Number);
                const yArr = initY.split('').map(Number);
                const zArr = initZ.split('').map(Number);

                const s0Detail = cfg.getKeystreamFormula(xArr, yArr, zArr);

                return (
                    <div className="bg-slate-900 border border-sky-800/60 rounded-2xl p-5 shadow-xl text-slate-100 font-mono space-y-5">
                        <div className="border-b border-sky-800/60 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-sky-400">MÃ DÒNG: {cfg.name} (Trạng thái Ban đầu)</h3>
                            <span className="text-xs px-2.5 py-1 rounded bg-sky-950 text-sky-300 border border-sky-700">Bước 0</span>
                        </div>
                        
                        <div className="space-y-4 text-sm">
                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-wrap justify-between gap-2">
                                <div>Chế độ: <strong className="text-sky-300">{isEncrypt ? "Mã hóa (P → C)" : "Giải mã (C → P)"}</strong></div>
                                <div>Đầu vào: <strong className="text-emerald-400">{inputData}</strong></div>
                                <div className="break-all">Khóa K: <strong className="text-sky-300">{initialKey}</strong></div>
                            </div>

                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                                <div className="text-gray-300 font-bold">Phân bổ 3 thanh ghi X, Y, Z ban đầu:</div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <div className="bg-slate-900 p-2.5 rounded border border-slate-700 flex justify-between">
                                        <span className="text-sky-400 font-bold">X ({xLen} bits):</span>
                                        <span className="tracking-widest font-bold">{initX}</span>
                                    </div>
                                    <div className="bg-slate-900 p-2.5 rounded border border-slate-700 flex justify-between">
                                        <span className="text-sky-400 font-bold">Y ({yLen} bits):</span>
                                        <span className="tracking-widest font-bold">{initY}</span>
                                    </div>
                                    <div className="bg-slate-900 p-2.5 rounded border border-slate-700 flex justify-between">
                                        <span className="text-sky-400 font-bold">Z ({zLen} bits):</span>
                                        <span className="tracking-widest font-bold">{initZ}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Công thức bit khóa s0 */}
                            <div className="bg-amber-950/30 p-4 rounded-xl border border-amber-800/60 space-y-2">
                                <div className="text-amber-300 font-bold text-base">
                                    Bit khóa dòng ban đầu (s<sub>0</sub>):
                                </div>
                                <div className="text-sm font-mono text-slate-200">
                                    <div>Công thức: <span className="text-purple-300 font-bold">{s0Detail.formula}</span></div>
                                    <div>Thay giá trị: <span className="text-emerald-300 font-bold">{s0Detail.calculation}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // BƯỚC >= 1
            const stepNum = step.stepIndex - 1;
            const { clockBits, m, willClock, stateBefore, stateAfterX, stateAfterY, stateAfterZ, keystreamBit, keystreamDetail, inputBit, outputBit, tValues } = step;

            let currentX = stateBefore.X;
            let currentY = stateBefore.Y;
            let currentZ = stateBefore.Z;

            if (activeSubStep >= 1) currentX = stateAfterX;
            if (activeSubStep >= 2) currentY = stateAfterY;
            if (activeSubStep >= 3) currentZ = stateAfterZ;

            const subStepTitles = [
                `1. Tính m = maj(x_${cfg.X.clockIdx}, y_${cfg.Y.clockIdx}, z_${cfg.Z.clockIdx})`,
                `2. Quay X (nếu x_${cfg.X.clockIdx} == m)`,
                `3. Quay Y (nếu y_${cfg.Y.clockIdx} == m)`,
                `4. Quay Z (nếu z_${cfg.Z.clockIdx} == m)`,
                `5. Tạo bit s_${stepNum} & XOR`
            ];

            return (
                <div className="bg-slate-900 border border-sky-800/60 rounded-2xl p-5 shadow-xl text-slate-100 font-mono space-y-5">
                    {/* Header */}
                    <div className="border-b border-sky-800/60 pb-3 flex justify-between items-center flex-wrap gap-2">
                        <h3 className="text-lg font-bold text-sky-400">
                            Bước {stepNum}: <span className="text-amber-300">x<sub>{cfg.X.clockIdx}</sub> = {clockBits.X}, y<sub>{cfg.Y.clockIdx}</sub> = {clockBits.Y}, z<sub>{cfg.Z.clockIdx}</sub> = {clockBits.Z}</span>
                        </h3>
                        <span className="text-xs px-3 py-1 rounded bg-emerald-950 text-emerald-300 border border-emerald-700 font-bold">
                            m = maj({clockBits.X}, {clockBits.Y}, {clockBits.Z}) = {m}
                        </span>
                    </div>

                    {/* Sub-step navigation */}
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 text-xs sm:text-sm">
                        <div className="flex justify-between items-center gap-2">
                            <div className="text-amber-300 font-semibold">
                                Thanh ghi quay: {[willClock.X && "quay X", willClock.Y && "quay Y", willClock.Z && "quay Z"].filter(Boolean).join(", ") || "Không quay"}
                            </div>
                            <div className="text-sky-300 text-xs">
                                Tiến trình: {activeSubStep + 1}/5
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-1.5 pt-1">
                            {subStepTitles.map((title, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setActiveSubStep(idx)}
                                    className={`px-2 py-1 rounded text-[11px] font-semibold text-left truncate border ${activeSubStep === idx ? 'bg-amber-500 text-slate-950 font-bold border-amber-400' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200'}`}
                                >
                                    {title}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Animated Registers */}
                    <div className="space-y-3">
                        <AnimatedRegister
                            name="X"
                            bits={currentX}
                            prevBits={stateBefore.X}
                            clockIdx={cfg.X.clockIdx}
                            tapIndices={cfg.X.taps}
                            outIdx={cfg.X.outIdx}
                            willClock={willClock.X}
                            tVal={tValues.X}
                            isClockingNow={willClock.X && activeSubStep === 1}
                        />
                        <AnimatedRegister
                            name="Y"
                            bits={currentY}
                            prevBits={stateBefore.Y}
                            clockIdx={cfg.Y.clockIdx}
                            tapIndices={cfg.Y.taps}
                            outIdx={cfg.Y.outIdx}
                            willClock={willClock.Y}
                            tVal={tValues.Y}
                            isClockingNow={willClock.Y && activeSubStep === 2}
                        />
                        <AnimatedRegister
                            name="Z"
                            bits={currentZ}
                            prevBits={stateBefore.Z}
                            clockIdx={cfg.Z.clockIdx}
                            tapIndices={cfg.Z.taps}
                            outIdx={cfg.Z.outIdx}
                            willClock={willClock.Z}
                            tVal={tValues.Z}
                            isClockingNow={willClock.Z && activeSubStep === 3}
                        />
                    </div>

                    {/* Detailed Calculation Formula */}
                    <div className="bg-emerald-950/30 p-4 rounded-xl border border-emerald-800/60 space-y-3">
                        <div className="space-y-1">
                            <div className="text-emerald-300 font-bold text-sm sm:text-base">
                                Bit khóa dòng sinh ra: <span className="text-amber-300">s<sub>{stepNum}</sub> = {keystreamBit}</span>
                            </div>
                            <div className="text-xs text-slate-300 font-mono">
                                <span>Công thức: <strong>{keystreamDetail.formula}</strong></span>
                                <span className="mx-2">|</span>
                                <span>Thay số: <strong className="text-amber-300">{keystreamDetail.calculation}</strong></span>
                            </div>
                        </div>

                        <div className="border-t border-emerald-800/50 pt-2 flex flex-col sm:flex-row justify-between items-center text-xs sm:text-sm font-mono text-emerald-200">
                            <div>
                                {isEncrypt ? (
                                    <span>Mã hóa: Bản rõ P<sub>{stepNum}</sub> ({inputBit}) ⊕ s<sub>{stepNum}</sub> ({keystreamBit}) = Bản mã C<sub>{stepNum}</sub> (<strong className="text-amber-300 text-base">{outputBit}</strong>)</span>
                                ) : (
                                    <span>Giải mã: Bản mã C<sub>{stepNum}</sub> ({inputBit}) ⊕ s<sub>{stepNum}</sub> ({keystreamBit}) = Bản rõ P<sub>{stepNum}</sub> (<strong className="text-sky-300 text-base">{outputBit}</strong>)</span>
                                )}
                            </div>
                            <div className="text-xs text-gray-400 mt-1 sm:mt-0">
                                Kết quả tích lũy: <strong className="text-emerald-400">{step.resultSoFar}</strong>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [algoKey, setAlgoKey] = useState("tiny");
            const [keyInput, setKeyInput] = useState(ALGO_CONFIGS.tiny.defaultKey);
            const [dataInput, setDataInput] = useState(ALGO_CONFIGS.tiny.defaultInput);
            const [mode, setMode] = useState("encrypt");
            
            const [currentStepIdx, setCurrentStepIdx] = useState(0);
            const [activeSubStep, setActiveSubStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1200);
            const [textHelper, setTextHelper] = useState("H");

            const currentCfg = ALGO_CONFIGS[algoKey];

            const handleSwitchAlgo = (newAlgo) => {
                setAlgoKey(newAlgo);
                const targetCfg = ALGO_CONFIGS[newAlgo];
                setKeyInput(targetCfg.defaultKey);
                setDataInput(targetCfg.defaultInput);
                setCurrentStepIdx(0);
                setActiveSubStep(0);
                setIsPlaying(false);
            };

            const simResult = useMemo(() => {
                return computeSimulationSteps(algoKey, keyInput.trim(), dataInput.trim(), mode === "encrypt");
            }, [algoKey, keyInput, dataInput, mode]);

            const fallbackStep = {
                stepIndex: 0,
                inputBit: 0,
                X: new Array(currentCfg.X.len).fill(0),
                Y: new Array(currentCfg.Y.len).fill(0),
                Z: new Array(currentCfg.Z.len).fill(0),
                clockBits: { X: 0, Y: 0, Z: 0 },
                m: 0,
                willClock: { X: false, Y: false, Z: false },
                tValues: { X: 0, Y: 0, Z: 0 },
                keystreamBit: 0,
                keystreamDetail: { formula: '', calculation: '' },
                outputBit: 0,
                resultSoFar: '',
                keystreamSoFar: ''
            };

            const steps = simResult.steps || [fallbackStep];
            const currentStep = steps[currentStepIdx] || steps[0] || fallbackStep;

            useEffect(() => {
                let timer = null;
                if (isPlaying) {
                    timer = setInterval(() => {
                        setActiveSubStep(prevSub => {
                            if (prevSub < 4) {
                                return prevSub + 1;
                            } else {
                                setCurrentStepIdx(prevStep => {
                                    if (prevStep < steps.length - 1) {
                                        return prevStep + 1;
                                    } else {
                                        setIsPlaying(false);
                                        return prevStep;
                                    }
                                });
                                return 0;
                            }
                        });
                    }, speed / 2);
                }
                return () => { if (timer) clearInterval(timer); };
            }, [isPlaying, speed, steps.length]);

            useEffect(() => {
                setCurrentStepIdx(0);
                setActiveSubStep(0);
                setIsPlaying(false);
            }, [keyInput, dataInput, mode, algoKey]);

            const generateRandomKey = () => {
                let res = "";
                for (let i = 0; i < currentCfg.keyLength; i++) {
                    res += Math.random() < 0.5 ? "0" : "1";
                }
                setKeyInput(res);
            };

            const applyTextToBinary = () => {
                if (!textHelper) return;
                if (algoKey === "tiny") {
                    const bin = textToBinary3Bit(textHelper);
                    if (bin) setDataInput(bin);
                } else {
                    const bin = textToBinary8Bit(textHelper);
                    if (bin) setDataInput(bin);
                }
            };

            const characterResult = algoKey === "tiny" 
                ? binaryToText3Bit(simResult.finalResult || '')
                : binaryToText8Bit(simResult.finalResult || '');

            return (
                <div className="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-6">
                    {/* HEADER */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-gray-800">
                        <div>
                            <h1 className="text-2xl font-bold text-white">
                                Mô Phỏng Thuật Toán Mã Dòng A5/1 & Tiny A5/1
                            </h1>
                        </div>

                        {/* ALGORITHM & MODE SWITCHERS */}
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                                <button
                                    onClick={() => handleSwitchAlgo("tiny")}
                                    className={`px-3 py-1.5 rounded-lg font-bold transition ${algoKey === "tiny" ? "bg-amber-600 text-white shadow" : "text-gray-400 hover:text-white"}`}
                                >
                                    Tiny A5/1 (23b)
                                </button>
                                <button
                                    onClick={() => handleSwitchAlgo("full")}
                                    className={`px-3 py-1.5 rounded-lg font-bold transition ${algoKey === "full" ? "bg-indigo-600 text-white shadow" : "text-gray-400 hover:text-white"}`}
                                >
                                    A5/1 Đầy đủ (64b)
                                </button>
                            </div>

                            <div className="flex items-center bg-gray-900 p-1 rounded-xl border border-gray-800 text-xs">
                                <button
                                    onClick={() => setMode("encrypt")}
                                    className={`px-3 py-1.5 rounded-lg font-bold transition ${mode === "encrypt" ? "bg-blue-600 text-white shadow" : "text-gray-400 hover:text-white"}`}
                                >
                                    Mã Hóa
                                </button>
                                <button
                                    onClick={() => setMode("decrypt")}
                                    className={`px-3 py-1.5 rounded-lg font-bold transition ${mode === "decrypt" ? "bg-emerald-600 text-white shadow" : "text-gray-400 hover:text-white"}`}
                                >
                                    Giải Mã
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* INPUT SECTION */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className="lg:col-span-8 bg-cyber-card p-5 rounded-2xl border border-cyber-border shadow-xl space-y-4">
                            <div className="flex items-center justify-between">
                                <h2 className="text-base font-semibold text-white">
                                    Cấu hình Dữ liệu ({currentCfg.name} - {mode === "encrypt" ? "Mã hóa" : "Giải mã"})
                                </h2>
                                {simResult.error && (
                                    <span className="text-xs text-red-400 bg-red-950/80 px-3 py-1 rounded border border-red-800/50">
                                        ⚠️ {simResult.error}
                                    </span>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <div className="flex justify-between items-center mb-1.5">
                                        <label className="text-xs font-medium text-gray-300">Khóa K ({currentCfg.keyLength} bits):</label>
                                        <span className={`text-xs font-mono px-2 py-0.5 rounded ${keyInput.length === currentCfg.keyLength ? "bg-emerald-950 text-emerald-400" : "bg-amber-950 text-amber-400"}`}>
                                            {keyInput.length}/{currentCfg.keyLength} bits
                                        </span>
                                    </div>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={keyInput}
                                            onChange={(e) => setKeyInput(e.target.value.replace(/[^01]/g, ''))}
                                            className="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs font-mono text-blue-300 focus:outline-none focus:border-blue-500 break-all"
                                            maxLength={currentCfg.keyLength}
                                        />
                                        <button
                                            onClick={generateRandomKey}
                                            className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs rounded-lg border border-gray-700 transition flex-shrink-0"
                                        >
                                            Ngẫu nhiên
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-1.5">
                                        <label className="text-xs font-medium text-gray-300">
                                            {mode === "encrypt" ? "Bản rõ P (Chuỗi Bit):" : "Bản mã C (Chuỗi Bit):"}
                                        </label>
                                        <span className="text-xs font-mono text-gray-400">{dataInput.length} bits</span>
                                    </div>
                                    <input
                                        type="text"
                                        value={dataInput}
                                        onChange={(e) => setDataInput(e.target.value.replace(/[^01]/g, ''))}
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs font-mono text-emerald-400 focus:outline-none focus:border-emerald-500 break-all"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* TEXT CONVERSION HELPER */}
                        <div className="lg:col-span-4 bg-cyber-card p-5 rounded-2xl border border-cyber-border shadow-xl flex flex-col justify-between space-y-3">
                            <div>
                                <h3 className="text-sm font-semibold text-gray-200">
                                    {algoKey === "tiny" ? "Chuyển Đổi Ký Tự (Mã 3-bit: A-H)" : "Chuyển Đổi Ký Tự (ASCII 8-bit)"}
                                </h3>
                                <p className="text-[11px] text-gray-400 mt-1">
                                    {algoKey === "tiny" 
                                        ? "Mã hóa mỗi ký tự (A đến H) thành 3 bits nhị phân liên tiếp." 
                                        : "Chuyển ký tự văn bản chuẩn ASCII (1 ký tự = 8 bits)."}
                                </p>
                                <div className="flex gap-2 mt-3">
                                    <input
                                        type="text"
                                        value={textHelper}
                                        onChange={(e) => setTextHelper(e.target.value)}
                                        placeholder={algoKey === "tiny" ? "Ví dụ: HA" : "Ví dụ: Hello"}
                                        className="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none font-mono"
                                    />
                                    <button
                                        onClick={applyTextToBinary}
                                        className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition"
                                    >
                                        Chuyển Bit
                                    </button>
                                </div>
                            </div>
                            <div className="text-xs font-mono text-gray-300 bg-gray-900/90 p-2.5 rounded-lg border border-gray-800 space-y-1">
                                <div className="text-gray-400 text-[11px]">Ký tự tương ứng với kết quả:</div>
                                <div className="text-amber-300 font-bold text-sm">
                                    {characterResult 
                                        ? `"${characterResult}"` 
                                        : <span className="text-gray-500 font-normal text-xs">
                                            {algoKey === "tiny" ? "(Cần bội số 3 bits, A-H)" : "(Cần đủ bội số 8 bits)"}
                                          </span>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* CONTROLS BAR */}
                    <div className="bg-cyber-card p-4 rounded-2xl border border-cyber-border shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-2">
                            <button onClick={() => { setIsPlaying(false); setCurrentStepIdx(0); setActiveSubStep(0); }} className="p-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl text-gray-300 text-xs font-bold" title="Về đầu">Về đầu</button>
                            <button onClick={() => { setIsPlaying(false); setCurrentStepIdx(prev => Math.max(0, prev - 1)); setActiveSubStep(0); }} disabled={currentStepIdx === 0} className="p-2.5 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 rounded-xl text-gray-300 text-xs font-bold">Trước</button>
                            
                            <button onClick={() => { 
                                if (currentStepIdx >= steps.length - 1) {
                                    setCurrentStepIdx(0);
                                    setActiveSubStep(0);
                                }
                                setIsPlaying(!isPlaying); 
                            }} className={`px-5 py-2.5 rounded-xl font-semibold text-sm transition shadow-lg ${isPlaying ? "bg-amber-600 text-white" : "bg-emerald-600 text-white"}`}>
                                {isPlaying ? "Tạm dừng" : "Chạy Tự Động"}
                            </button>

                            <button onClick={() => { 
                                setIsPlaying(false); 
                                if (activeSubStep < 4) {
                                    setActiveSubStep(prev => prev + 1);
                                } else if (currentStepIdx < steps.length - 1) {
                                    setCurrentStepIdx(prev => prev + 1);
                                    setActiveSubStep(0);
                                }
                            }} disabled={currentStepIdx >= steps.length - 1 && activeSubStep >= 4} className="px-3.5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 rounded-xl text-white font-bold text-xs shadow">
                                Bước Kế ({activeSubStep + 1}/5)
                            </button>

                            <button onClick={() => { setIsPlaying(false); setCurrentStepIdx(steps.length - 1); setActiveSubStep(4); }} className="p-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl text-gray-300 text-xs font-bold">Đến cuối</button>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="text-center">
                                <span className="text-xs text-gray-400 block">Tiến trình</span>
                                <span className="text-lg font-bold font-mono text-sky-400">
                                    Bước {currentStepIdx === 0 ? 0 : currentStepIdx - 1} / {Math.max(0, steps.length - 2)}
                                </span>
                            </div>
                            <div className="flex flex-col w-32">
                                <span className="text-xs text-gray-400 mb-1">Tốc độ: {speed}ms</span>
                                <input type="range" min="400" max="3000" step="100" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                            </div>
                        </div>

                        <div className="bg-gray-900/90 px-4 py-2 rounded-xl border border-gray-800 font-mono text-xs space-y-1">
                            <div>Dãy khóa S = <span className="text-amber-300 font-bold">{simResult.finalKeystream || "---"}</span></div>
                            <div>
                                {mode === "encrypt" ? "Bản mã C = " : "Bản rõ P = "}
                                <span className="text-emerald-400 font-bold">{simResult.finalResult || "---"}</span>
                            </div>
                        </div>
                    </div>

                    {/* VISUALIZATION AREA */}
                    <CombinedSlideView
                        step={currentStep}
                        initialKey={keyInput}
                        isEncrypt={mode === "encrypt"}
                        inputData={dataInput}
                        algoKey={algoKey}
                        activeSubStep={activeSubStep}
                        setActiveSubStep={setActiveSubStep}
                    />

                    {/* SUMMARY CONCLUSION PANEL */}
                    <div className="bg-slate-900 p-5 rounded-2xl border border-sky-800/60 shadow-xl space-y-3 font-mono text-sm">
                        <h3 className="text-base font-bold text-sky-400">
                            Tổng kết Kết quả ({mode === "encrypt" ? "Mã hóa" : "Giải mã"}):
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs md:text-sm">
                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <span className="text-gray-400 block">Dãy khóa dòng S sinh ra:</span>
                                <span className="text-lg font-bold text-amber-300">{simResult.finalKeystream || "---"}</span>
                            </div>
                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <span className="text-gray-400 block">
                                    {mode === "encrypt" ? "Mã hóa: P ⊕ S = C" : "Giải mã: C ⊕ S = P"}
                                </span>
                                <span className="text-lg font-bold text-emerald-400">
                                    {dataInput} ⊕ {simResult.finalKeystream || "---"} = {simResult.finalResult || "---"}
                                </span>
                            </div>
                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <span className="text-gray-400 block">Kiểm tra đảo ngược:</span>
                                <span className="text-lg font-bold text-sky-300">
                                    {simResult.finalResult || "---"} ⊕ {simResult.finalKeystream || "---"} = {dataInput}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* STEP LOG TABLE */}
                    <div className="bg-cyber-card p-5 rounded-2xl border border-cyber-border shadow-xl space-y-4">
                        <h2 className="text-base font-semibold text-white">Bảng Nhật ký Chi tiết Các Bước</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-xs font-mono">
                                <thead>
                                    <tr className="bg-gray-900 text-gray-400 border-b border-gray-800">
                                        <th className="p-2.5 text-center">Bước #</th>
                                        <th className="p-2.5 text-center">Clock Bits</th>
                                        <th className="p-2.5 text-center">m = maj()</th>
                                        <th className="p-2.5 text-center">Thanh ghi Quay</th>
                                        <th className="p-2.5 text-center">Bit Khóa s_i</th>
                                        <th className="p-2.5 text-center">Bit Kết quả</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-800/60">
                                    {steps.slice(1).map((step) => {
                                        const isSelected = step.stepIndex === currentStepIdx;
                                        return (
                                            <tr
                                                key={step.stepIndex}
                                                onClick={() => { setIsPlaying(false); setCurrentStepIdx(step.stepIndex); setActiveSubStep(0); }}
                                                className={`cursor-pointer transition-colors ${isSelected ? "bg-blue-950/80 font-bold text-white border-l-4 border-sky-400" : "hover:bg-gray-800/40 text-gray-300"}`}
                                            >
                                                <td className="p-2.5 text-center text-sky-400 font-bold">Bước {step.stepIndex - 1}</td>
                                                <td className="p-2.5 text-center text-amber-300">({step.clockBits.X}, {step.clockBits.Y}, {step.clockBits.Z})</td>
                                                <td className="p-2.5 text-center text-purple-300">{step.m}</td>
                                                <td className="p-2.5 text-center">
                                                    {[step.willClock.X && "X", step.willClock.Y && "Y", step.willClock.Z && "Z"].filter(Boolean).join(", ")}
                                                </td>
                                                <td className="p-2.5 text-center text-amber-300 font-bold">{step.keystreamBit}</td>
                                                <td className="p-2.5 text-center text-emerald-400 font-bold">{step.outputBit}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
